<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="title">
      <h1>Rock Paper Scissors</h1>
    </div>
    <div class="choices">
      <div class="rock">
        <img id="0" src="/Assets/rock.png" alt="Rock" />
      </div>
      <div class="paper">
        <img id="1" src="/Assets/paper.png" alt="Paper" />
      </div>
      <div class="scissors">
        <img id="2" src="/Assets/scissors.png" alt="Scissors" />
      </div>
    </div>
    <div class="score">
      <div id="user">
        <p id="user-score">0</p>
        <p>User</p>
      </div>
      <div id="comp">
        <p id="comp-score">0</p>
        <p>Comp</p>
      </div>
    </div>
    <div id="msg">
      <p>Play Your Move</p>
    </div>
    <div id="reset-btn">
      <button>Reset Game</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
