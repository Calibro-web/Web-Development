<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Game</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"6fd
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="background">
      <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSq8c_V4D4ggcTYNICi0BiIAaEJyGIwVNroZt_IN29lh4Ng7aitH5oP_e0&s=10"
        alt="AI Theme"
      />
    </div>
    <div class="interface">
      <div class="navbar">
        <img
          src="https://content.jdmagicbox.com/v2/comp/bangalore/m5/080pxx80.xx80.180222224238.x6m5/catalogue/narayana-group-of-educational-institutions-uttarahalli-bangalore-17soaeenqd.jpg"
          alt="Narayana Logo"
        />
        <h1>STEAMFINITY</h1>
        <p id="creator">By Bidyarnab Barman and Advik Bagchi</p>
      </div>
      <div class="board">
        <h1>Welcome! Ladies and Gentlemen</h1>
        <p>
          to our Project to Start the Quiz Game click the button
          <i class="fa-solid fa-arrow-down"></i>
        </p>
        <button id="start">Quiz Game</button>
      </div>
    </div>
    <div class="main">
      <h1>Quiz Game</h1>
      <div class="question">
        <h3 id="level"></h3>
        <p></p>
      </div>
      <p id="result" class="none">You WIN!</p>
      <div class="options">
        <button id="btn1"></button>
        <button id="btn2"></button>
        <button id="btn3"></button>
        <button id="btn4"></button>
      </div>
      <div class="slider">
        <button id="next" class="hide">
          <i class="fa-solid fa-forward"></i>
        </button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
