<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main">
      <div id="title">
        <h1>Weather App</h1>
      </div>
      <div class="body">
        <div class="input">
          <p>Enter Place Name</p>
          <input type="text" placeholder="Enter Place" />
        </div>
        <div id="btn">
          <button>Get Weather</button>
        </div>
        <div class="result">
          <p id="temp">Temperature: ℃</p>
          <p id="humid">Humidity: %</p>
          <p id="wind_speed">Wind Speed: km/h</p>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
